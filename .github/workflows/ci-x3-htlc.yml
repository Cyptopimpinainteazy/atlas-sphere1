name: CI - x3-htlc

on:
  push:
    paths:
      - 'crates/x3-htlc/**'
      - 'crates/x3-runtime/**'
      - '.github/workflows/ci-x3-htlc.yml'
  pull_request:
    paths:
      - 'crates/x3-htlc/**'
      - 'crates/x3-runtime/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Run x3-htlc tests
        run: |
          cargo test -p x3-htlc --all-features --no-fail-fast

