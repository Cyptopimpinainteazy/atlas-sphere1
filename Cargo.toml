[workspace]
members = [
    # Substrate L1
    "pallets/atlas-kernel",
    "pallets/audit-governance",
    "pallets/pallet-invariants",
    "pallets/swarm-media",
    "pallets/swarm-evolution",
    "crates/evm-integration",
    "crates/svm-integration",
    "crates/cross-vm-bridge",
    "crates/x3-htlc",
    "runtime",
    "node",
]
default-members = ["runtime"]
resolver = "2"

[workspace.metadata.x3]
# X3 language configuration for different build targets
std-features = ["std", "internment/intern", "rustc-hash/std"]
native-only = ["crates/x3-ast", "crates/x3-common", "crates/x3-lexer", "crates/x3-tools", "crates/x3-vm", "crates/x3-compiler"]

[workspace.metadata.coverage]
runtime = 95
pallets = 90
vm = 90
daemon = 85
ai = 80

# Force getrandom 0.2.x for wasm32 compatibility (0.3.x doesn't support wasm32-unknown-unknown)
# Pin tempfile, ahash, errno, and rustix to versions compatible with wasm32
# Force resolution of transitive dependency conflicts from old Substrate/Frontier versions
# These patches redirect all versions of sp-* crates to stable2412 versions
[patch."https://github.com/paritytech/substrate"]
sp-api = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-block-builder = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-consensus-aura = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-consensus-grandpa = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-externalities = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-inherents = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-keystore = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-offchain = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-session = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-storage = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-state-machine = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-blockchain = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-consensus = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-timestamp = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-trie = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-version = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-weights = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }

# WASM-friendly dependency overrides for polkadot-sdk branch
# environmental = { path = "patches/environmental" }

[patch.crates-io]
# WASM-friendly overrides for registry crates
errno = { path = "patches/errno" }

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Atlas Sphere Core Team <core@atlas-sphere.io>"]
homepage = "https://atlas-sphere.io"
repository = "https://github.com/Cyptopimpinainteazy/atlas-sphere"
description = "Atlas Sphere Layer 1 blockchain workspace powering a dual-VM execution environment."
license = "Apache-2.0"
readme = "README.md"
keywords = ["atlas-sphere", "substrate", "blockchain", "dual-vm", "web3"]
categories = ["cryptography::cryptocurrencies"]

[workspace.dependencies]
# Substrate primitives
sp-api = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-block-builder = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
